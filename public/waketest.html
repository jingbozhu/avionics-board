<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silk Wake Test — avionics board</title>
<style>
  /* Self-contained on purpose: this page must work fully offline on the LAN. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #06090e; color: #d7e3ee;
    font-family: system-ui, sans-serif;
    padding: 4vw; /* TV overscan margin */
    overflow: hidden;
  }
  h1 { font-size: 3.2vw; letter-spacing: 0.08em; color: #7fd4ff; margin-bottom: 1vw; }
  .sub { font-size: 1.6vw; color: #8aa0b4; margin-bottom: 2.5vw; }
  .modes { display: flex; flex-wrap: wrap; gap: 1.5vw; margin-bottom: 2.5vw; }
  .modes a {
    display: block; padding: 1.6vw 2.4vw; font-size: 2vw; text-decoration: none;
    color: #d7e3ee; background: #101b28; border: 0.2vw solid #24425e; border-radius: 0.8vw;
  }
  .modes a:focus, .modes a:hover { border-color: #7fd4ff; color: #ffffff; background: #16283c; }
  .modes a.active { border-color: #38e07b; color: #38e07b; }
  #elapsed { font-size: 11vw; font-variant-numeric: tabular-nums; line-height: 1.1; }
  #verdict { font-size: 2.6vw; margin: 1vw 0 2vw; color: #8aa0b4; }
  #verdict.pass { color: #38e07b; }
  .row { display: flex; gap: 4vw; align-items: flex-start; }
  .col { flex: 1; min-width: 0; }
  .stat { font-size: 1.7vw; padding: 0.3vw 0; }
  .stat b { color: #7fd4ff; }
  .bad { color: #ff6b6b; } .good { color: #38e07b; }
  #log {
    font-family: ui-monospace, monospace; font-size: 1.3vw; color: #9db4c8;
    max-height: 34vh; overflow: hidden; white-space: pre-wrap;
  }
  #prev { font-size: 1.6vw; color: #e8c76a; margin-bottom: 2vw; }
  /* Small MediaStream-backed video: fully visible (intersection ratio 1.0),
     exempt from Chromium's 20%-of-viewport size rule because src is a MediaStream. */
  #vidSmall { position: fixed; right: 4vw; bottom: 4vw; width: 200px; height: 150px;
              border: 2px solid #24425e; background: #000; display: none; }
  /* Big video: >20% of viewport area, for Chromium builds without the MediaStream exemption. */
  #vidBig { position: fixed; right: 4vw; bottom: 4vw; width: 60vw; height: 50vh;
            border: 2px solid #24425e; background: #000; display: none; }
  #srcCanvas { display: none; }
</style>
</head>
<body>
  <h1>SILK WAKE TEST</h1>
  <div class="sub">Pick a mode, put the remote down, and do not touch anything for 30 minutes.
    If the screen is still on past 25:00, that technique defeats the Fire OS sleep timer.</div>

  <div id="prev"></div>

  <div class="modes" id="modes">
    <a href="?mode=none">CONTROL (nothing)</a>
    <a href="?mode=wakelock">WAKE LOCK API</a>
    <a href="?mode=video">SMALL STREAM VIDEO</a>
    <a href="?mode=bigvideo">BIG STREAM VIDEO</a>
    <a href="?mode=all">ALL COMBINED</a>
  </div>

  <div id="elapsed">00:00</div>
  <div id="verdict">mode: none selected yet</div>

  <div class="row">
    <div class="col" id="stats"></div>
    <div class="col"><div id="log"></div></div>
  </div>

  <canvas id="srcCanvas" width="320" height="240"></canvas>
  <video id="vidSmall" muted playsinline></video>
  <video id="vidBig" muted playsinline></video>

<script>
(function () {
  'use strict';
  var LS_KEY = 'silk-waketest';
  var mode = (new URLSearchParams(location.search).get('mode')) || '';
  var start = Date.now();
  var events = [];
  var logEl = document.getElementById('log');
  var statsEl = document.getElementById('stats');
  var elapsedEl = document.getElementById('elapsed');
  var verdictEl = document.getElementById('verdict');

  function ts() { return new Date().toTimeString().slice(0, 8); }
  function logEvent(msg) {
    events.push(ts() + '  ' + msg);
    if (events.length > 22) events.shift();
    logEl.textContent = events.join('\n');
    persist();
  }
  function persist() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({
        mode: mode || 'none-selected', startedAt: start, lastBeat: Date.now(), events: events
      }));
    } catch (e) { /* storage full/blocked — the on-screen log still works */ }
  }

  // Show how far the PREVIOUS run got before the page stopped ticking.
  try {
    var prev = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (prev && prev.lastBeat && prev.startedAt) {
      var secs = Math.max(0, Math.round((prev.lastBeat - prev.startedAt) / 1000));
      var mm = String(Math.floor(secs / 60)).padStart(2, '0');
      var ss = String(secs % 60).padStart(2, '0');
      document.getElementById('prev').textContent =
        'Previous run — mode "' + prev.mode + '" ticked for ' + mm + ':' + ss +
        ' before the page stopped. Last event: ' + (prev.events && prev.events.length ? prev.events[prev.events.length - 1] : 'none');
    }
  } catch (e) {}

  var links = document.querySelectorAll('.modes a');
  for (var i = 0; i < links.length; i++) {
    if (links[i].getAttribute('href') === '?mode=' + mode) links[i].className = 'active';
  }

  var stats = {};
  function setStat(name, value, cls) {
    stats[name] = '<div class="stat"><b>' + name + ':</b> <span class="' + (cls || '') + '">' + value + '</span></div>';
    var html = '';
    for (var k in stats) html += stats[k];
    statsEl.innerHTML = html;
  }

  setStat('user agent', navigator.userAgent.replace(/^Mozilla\/5\.0 /, ''));
  setStat('wakeLock API', ('wakeLock' in navigator) ? 'SUPPORTED' : 'NOT SUPPORTED',
          ('wakeLock' in navigator) ? 'good' : 'bad');
  setStat('captureStream', (typeof HTMLCanvasElement !== 'undefined' &&
          HTMLCanvasElement.prototype.captureStream) ? 'SUPPORTED' : 'NOT SUPPORTED',
          HTMLCanvasElement.prototype.captureStream ? 'good' : 'bad');

  document.addEventListener('visibilitychange', function () {
    logEvent('visibility -> ' + document.visibilityState);
    if (document.visibilityState === 'visible' && (mode === 'wakelock' || mode === 'all')) acquireLock();
  });

  // ---- Wake Lock API mode -------------------------------------------------
  var lock = null;
  function acquireLock() {
    if (!('wakeLock' in navigator)) { setStat('wake lock', 'API missing', 'bad'); return; }
    navigator.wakeLock.request('screen').then(function (l) {
      lock = l;
      setStat('wake lock', 'ACQUIRED', 'good');
      logEvent('wakeLock acquired');
      l.addEventListener('release', function () {
        setStat('wake lock', 'RELEASED', 'bad');
        logEvent('wakeLock released');
      });
    }).catch(function (e) {
      setStat('wake lock', 'FAILED: ' + e.name, 'bad');
      logEvent('wakeLock request failed: ' + e.name + ' — ' + e.message);
    });
  }

  // ---- MediaStream video modes -------------------------------------------
  // An animated canvas feeds a real, playing, visible <video>. Chromium holds
  // a screen wake lock for playing visible videos; MediaStream sources are
  // exempt from the "must cover 20% of the viewport" size rule.
  var rafTimer = null;
  function startCanvasFeed(videoEl, label) {
    var cv = document.getElementById('srcCanvas');
    var cx = cv.getContext('2d');
    var t0 = Date.now();
    if (!rafTimer) {
      rafTimer = setInterval(function () {
        var t = (Date.now() - t0) / 1000;
        cx.fillStyle = '#03121f'; cx.fillRect(0, 0, 320, 240);
        cx.fillStyle = '#7fd4ff';
        cx.beginPath();
        cx.arc(160 + Math.cos(t) * 110, 120 + Math.sin(t * 1.3) * 80, 14, 0, 6.2832);
        cx.fill();
        cx.font = '28px monospace'; cx.fillStyle = '#d7e3ee';
        cx.fillText(new Date().toTimeString().slice(0, 8), 90, 40);
      }, 200); /* 5 fps — enough to count as a playing video, cheap on the TV */
    }
    var stream = cv.captureStream(5);
    videoEl.srcObject = stream;
    videoEl.style.display = 'block';
    videoEl.addEventListener('pause', function () { logEvent(label + ' video PAUSED'); });
    videoEl.play().then(function () {
      setStat(label + ' video', 'PLAYING', 'good');
      logEvent(label + ' video playing');
    }).catch(function (e) {
      setStat(label + ' video', 'play() rejected: ' + e.name, 'bad');
      logEvent(label + ' video play() rejected: ' + e.name + ' — ' + e.message);
    });
  }

  if (mode === 'wakelock' || mode === 'all') acquireLock();
  if (mode === 'video' || mode === 'all') startCanvasFeed(document.getElementById('vidSmall'), 'small');
  if (mode === 'bigvideo') startCanvasFeed(document.getElementById('vidBig'), 'big');
  if (mode === 'none') logEvent('control mode: no wake technique active');
  if (mode) logEvent('mode "' + mode + '" started');

  // ---- Elapsed clock + heartbeat -----------------------------------------
  setInterval(function () {
    var secs = Math.round((Date.now() - start) / 1000);
    var mm = String(Math.floor(secs / 60)).padStart(2, '0');
    var ss = String(secs % 60).padStart(2, '0');
    elapsedEl.textContent = mm + ':' + ss;
    if (!mode) { verdictEl.textContent = 'mode: none selected yet'; }
    else if (secs >= 1500) {
      verdictEl.textContent = 'mode "' + mode + '" SURVIVED past the 20-minute sleep timer';
      verdictEl.className = 'pass';
    } else {
      verdictEl.textContent = 'mode "' + mode + '" running — survive until 25:00 to pass';
    }
    setStat('wall clock', new Date().toTimeString().slice(0, 8));
    persist();
  }, 1000);
})();
</script>
</body>
</html>
